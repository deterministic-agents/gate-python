# gate-python embedded schema bundle - v1.2.0
#
# Schemas bundled with gate-python so the validation module can run
# without depending on the gate-contracts repo at runtime. Hashes
# below are pinned at release time; if the bundled schemas drift
# from gate-contracts the validator will silently disagree with
# peers.
#
# Hash function: gate.hashing.gate_hash over the canonical JSON of
# each schema, matching gate/test_vectors/canonical_json_vectors.json.

gate_contracts_version: "1.2.0"
gate_contracts_source: "https://github.com/deterministic-agents/gate-contracts/releases/tag/v1.2.0"

